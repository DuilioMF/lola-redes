name: Sync project version

on:
  workflow_run:
    workflows: ["Deploy Lola Redes"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  notify-version-sync:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verificar VERSION publicada
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(curl -fsSL "https://raw.githubusercontent.com/DuilioMF/lola-redes/$RELEASE_SHA/VERSION" | tr -d '\r\n ')"
          [[ "$expected" =~ ^[0-9]+$ ]] || { echo "::error::VERSION inválida"; exit 1; }
          published="$(curl -fsSL --max-time 20 --header 'Cache-Control: no-cache' "https://duiliomf.github.io/lola-redes/VERSION?sha=$RELEASE_SHA" | tr -d '\r\n ')"
          [[ "$published" == "$expected" ]] || { echo "::error::Publicado=$published; esperado=$expected"; exit 1; }
          echo "version=L$((10#$expected))" >> "$GITHUB_OUTPUT"
      - name: Notificar Memoria Duilio
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python3 -c 'import json,os;print(json.dumps({"repository":"DuilioMF/lola-redes","sha":os.environ["RELEASE_SHA"],"ref":"refs/heads/main","version":os.environ["RELEASE_VERSION"],"publication_verified":True}))' > /tmp/release.json
          curl --fail --show-error --silent --retry 3 --retry-all-errors \
            -X POST -H 'Content-Type: application/json' \
            --data-binary @/tmp/release.json \
            'https://n8n.srv1251563.hstgr.cloud/webhook/memoria-version-sync-github-v1'
